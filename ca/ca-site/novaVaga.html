<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Vaga</title>
    <style>
        body {
            display: flex;
            justify-content: center;
        }
        form {
            background: #fff;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        h1 {
            font-size: 40px;
            color: #086E7C;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 800;
            text-align: center;
        }
        input {
            margin: 7px 0;
            border-radius: 5px;
            padding: 10px;
            /* width: 90%; */
        }
        input[type="checkbox"] {
            margin: 0 5px;
        }
        button {
            background: #086E7C;
            color: #ffffff;
            width: 90%;
            height: 50px;
            border-radius: 10px;
            border: none;
            font-size: 22px;
            font-weight: bold;
            margin: auto;
        }
    </style>
</head>
<body>

    <form action="" method="post">
        <h1>Nova vaga de emprego</h1>
        <fieldset>
            <legend>Sobre</legend>
            <p>
                <label for="">Nome da vaga</label><br>
                <input type="text" name="" id="">
            </p>
            <p>
                <label for="">Tipo de contratação</label><br>
                <select name="" id="" list="tipo-contratacao">
                    <option value="">CLT</option>
                    <option value="">PJ</option>
                    <option value="">Freelancer</option>
                </select>
            </p>
            <p>
                <label for="">Salário/Valor</label><br>
                <input type="number" name="" id="">
            </p>
        </fieldset>
        <fieldset>
            <legend>Requisitos</legend>
            <p>
                <label for="">Atribuições do cargo</label><br>
                <textarea name="" id="" rows="30" cols="50"></textarea>
            </p>
            <p>
                <label for="">Habilidades necessárias</label><br>
                <textarea name="" id="" rows="30" cols="50"></textarea>
            </p>
            <p>
                <label for="">Benefícios</label><br>
                <textarea name="" id="" rows="10" cols="50"></textarea>
            </p>
        </fieldset>
        <button type="submit">Acrescentar</button>
    </form>
    
</body>
</html>
